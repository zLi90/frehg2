# swe-microtopo / S0.02 (WL0.4143, A0.03) — rainfall runoff over synthetic
# microtopography, slope 2%. Frozen v2 schema, authored from the SERGHEI inputs
# (Hydrology/Analytical/microtopo/S0.02_WL0.4143_A0.03/input). Shares README
# with the S0.01 and S0.05 variants.
# Notes:
#   - 209x79 grid, dx = dy = 0.038278 m (8.0 m x 3.02 m). Microtopography on a
#     2% slope draining east.
#   - SERGHEI DEM north-up; rows REVERSED into input/dem_s0.02.dat.
#   - Manning n = 0.055. Infiltration none (SWE-only). Dry start (eta -10).
#   - Rain: 7.5 mm/h for 0-1800 s then dry -> series input/rain_s0.02.dat.
#   - Outer REFLECTIVE except the east outlet (SERGHEI bctype 5 free outflow).
#   - dt = 0.05 s: the finest microtopo grid (dx ~ 0.038 m) needs the smaller
#     step for the explicit advection; free surface semi-implicit.
# Caveat: frehg2's surface solver is SEMI-IMPLICIT vs SERGHEI's explicit
# scheme; for this subcritical rainfall-runoff case the difference is minor.
simulation:
  id: swe-microtopo-s0.02
  title: Rainfall runoff over microtopography (slope 2%)

domain:
  nx: 209
  ny: 79
  nz: 1
  dx: 0.038278
  dy: 0.038278
  dz: 1.0
  bottom_elevation: {file: input/dem_s0.02.dat}
  follow_terrain: false

time:
  dt: 0.05
  t_end: 8000
  output_interval: 60

modules:
  surface_water: true
  groundwater: false
  transport: false

surface_water:
  gravity: 9.81
  friction:
    law: manning
    coefficient: {constant: 0.055}     # SERGHEI roughness
  viscosity: {x: 1.0e-06, y: 1.0e-06}
  min_depth: 1.0e-03                    # SERGHEI dryDepth
  wetting_face_depth: 1.0e-03
  rainfall:
    series: {file: input/rain_s0.02.dat}
  evaporation: {constant: 0.0}

initial_conditions:
  surface:
    eta: {constant: -10.0}             # dry start

boundary_conditions:
  - name: outlet
    region: {polygon: [[7.85, -0.1], [7.85, 3.1], [8.05, 3.1], [8.05, -0.1]]}
    target: surface
    kind: outflow                      # SERGHEI bctype 5 free outflow, east

output:
  filename: out/s0.02.h5
  variables:
    surface: [eta, depth, uu, vv]
  monitors:
    - {name: outlet, i: 208, j: 39, variables: [depth, uu]}
