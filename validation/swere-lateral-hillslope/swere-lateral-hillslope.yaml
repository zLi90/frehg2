# swere-lateral-hillslope — Coupled lateral hillslope subsurface flow
# ============================================================================
# PROVENANCE: converted from SERGHEI-SWE-RE test case `case4/`
#   (testcases/serghei-swe-re-testcases/case4). A Hydrus2D/analytic-referenced
#   coupled surface-subsurface lateral hillslope; 5-year (157 680 000 s) run.
#   Source inputs: parameters.input, sw.input, subsurface.input, vg.input,
#   gwbc.input (+ headleft/headright/polygon*.input), soilID.input, dem.input,
#   head.input, rainfall.input. Authored against the v2 schema
#   (docs/user-guide/parameters.md), mirroring the b5-vcatchment idiom.
#
# CONVERSION NOTES
#   - Grid: nx=ncols(40), ny=nrows(1), nz=ndepth(60). dx=dy=cellsize(100 m);
#     the case is a 1-cell-wide x-z hillslope strip (ny=1), so no raster row
#     reversal is needed. dz=dz_base(0.25); height 15.0 = 60 x 0.25 (checks).
#   - Terrain-following mesh: the SERGHEI subsurface is a 15 m terrain-parallel
#     slab below the DEM (dem 3.9 -> 0.0, a gentle 0.001 slope). Represented
#     with follow_terrain: true + terrain_layers: uniform (b5/A12 idiom): every
#     column carries its own 60 x 0.25 m slab below its bed. The inclined
#     hillslope geometry is thus approximated on a rectilinear grid.
#   - gw scheme: SERGHEI gw_scheme 1 (PCA) -> pca.
#   - Surface forcing: sw.input initialMode dry, manning n=0.03; there is NO
#     extbc.input, so the surface has reflective walls (parameters BCtype
#     REFLECTIVE) and is driven only by rainfall.input (light, 0.017-0.108
#     mm/h) plus the coupled seepage exchange. rainfall mm/h -> m/s (/3.6e6),
#     hours -> s.
#   - Lateral GW BCs (gwbc.input): dir 2 (-x) "left" and dir 1 (+x) "right",
#     both bctype 2 = prescribed head with a depth-varying head file
#     (headleft/headright.input). Those files are hydrostatic below a water
#     table, clamped to -1.25 m in the unsaturated zone. frehg2's head BC has
#     no per-layer profile form, so each is represented as a hydrostatic head
#     BC (head = eta - z) with eta = the water-table elevation recovered from
#     the file's saturated portion: eta_left = -4.1 m, eta_right = -14.1 m
#     (both reproduce the file's bottom heads 6.88 / 0.78 to ~1%). The -1.25 m
#     unsaturated clamp is not reproduced (negligible lateral flux there).
#   - Top GW BC: gwbc.input "surface" (dir 6, bctype 8) marks the coupled top;
#     frehg2's coupler owns that exchange -> NO explicit BC (plan §5.7).
#   - IC: subsurface initialMode 2 (file-h) -> groundwater.head from a 3D flat
#     field built from head.input (k=0 = top layer). Surface initialMode dry ->
#     eta far below the bed.
#   - specific_storage: not in the SERGHEI input; set 1e-5 (schema requires it,
#     b5 value).
#   - CAVEATS: (1) semi-implicit surface solver differs from SERGHEI's explicit
#     SWE. (2) SERGHEI dynamically switches the top BC between ponding and
#     seepage; frehg2 approximates this with its built-in coupler.
# ============================================================================
simulation:
  id: swere-lateral-hillslope
  title: Coupled lateral hillslope subsurface flow (SERGHEI case4, 5 yr)

domain:
  nx: 40
  ny: 1
  nz: 60
  dx: 100.0
  dy: 100.0
  dz: 0.25
  dz_stretch: 1.0
  bottom_elevation: {file: input/dem.dat}
  follow_terrain: true
  terrain_layers: uniform
  decomposition: {mpi_nx: auto, mpi_ny: auto}

time:
  dt: 10.0            # sync common-step initial value (clamped to gw bounds)
  t_end: 157680000.0  # 5 years (SERGHEI simLength)
  output_interval: 259200  # SERGHEI outFreq (3 days)

modules:
  surface_water: true
  groundwater: true
  transport: false

surface_water:
  gravity: 9.81
  friction:
    law: manning
    coefficient: {constant: 0.03}
  viscosity: {x: 1.0e-06, y: 1.0e-06}
  min_depth: 1.0e-03          # SERGHEI dryDepth
  wetting_face_depth: 1.0e-03
  rainfall:
    series: {file: input/rain.dat}
  evaporation: {constant: 0.0}

groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 0.01     # SERGHEI dt_init (also minimum)
    dt_min: 0.01
    dt_max: 90.0      # SERGHEI dt_max
  specific_storage: 1.0e-05

soil:
  types:
    - name: hillslope-soil   # vg.input single soil
      ksx: 5.78e-04
      ksy: 5.78e-04
      ksz: 5.78e-04
      theta_s: 0.45
      theta_r: 0.1
      vg_alpha: 1.65
      vg_n: 2.0
      aev: 0.0
  map: {constant: hillslope-soil}

coupling: {mode: sync}

initial_conditions:
  surface:
    eta: {constant: -10.0}       # dry start (SERGHEI initialMode dry)
  groundwater:
    head: {file: input/head_init.dat}   # SERGHEI initialMode 2 (file-h)

boundary_conditions:
  - name: left-head
    region: {polygon: [[-1.0, -1.0], [99.0, -1.0], [99.0, 101.0], [-1.0, 101.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: -4.1}}   # headleft.input water table
  - name: right-head
    region: {polygon: [[3901.0, -1.0], [4001.0, -1.0], [4001.0, 101.0], [3901.0, 101.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: -14.1}}  # headright.input water table

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth, seepage]
    groundwater: [hydraulic_head, water_content]
  monitors:
    - {name: toe, i: 39, j: 0, variables: [depth, eta]}
  checkpoint: {interval: 0}
