# swere-superslab — Coupled heterogeneous "superslab" infiltration/return flow
# ============================================================================
# PROVENANCE: converted from SERGHEI-SWE-RE test case `case5/`
#   (testcases/serghei-swe-re-testcases/case5). Heterogeneous multi-soil
#   vertical-slab infiltration and return-flow test (Weill-style superslab);
#   12 h (43 200 s) run. Source inputs: parameters.input, sw.input,
#   subsurface.input, vg.input, gwbc.input (+ polygonbot.input), extbc.input
#   (+ polygon.input), soilID.input, dem.input, wt.input, rainfall.input.
#   Authored against the v2 schema (docs/user-guide/parameters.md), mirroring
#   the b5-vcatchment idiom.
#
# CONVERSION NOTES
#   - Grid: this is a 2-D vertical (x-z) cross section. nx=dem n_cols(100),
#     ny=1 (dem n_rows 1), nz=ndepth(100). dx=dy=cellsize(1.0). soilID.input
#     confirms the shape: 100 rows (depth layers k) x 100 cols (x cells i).
#   - dz: subsurface.input has height 5.0, ndepth 100, but dz_base 1.0 is
#     INCONSISTENT (100 x 1.0 = 100 != 5.0). The slab thickness is 5.0 m over
#     100 layers, and wt.input places the water table exactly at the domain
#     bottom (wt = bed - 5.0 for every column), so dz = height/ndepth = 0.05 m
#     is the intended resolution; dz_base 1.0 is treated as a stale field.
#   - Terrain-following mesh: dem rises 0.0 -> 9.9 m; the 5 m slab is
#     terrain-parallel -> follow_terrain: true + terrain_layers: uniform
#     (b5/A12 idiom). The sloped domain is approximated on a rectilinear grid.
#   - Soils: vg.input has 3 semicolon-separated soils -> 3 soil.types[]. The
#     3D soil map is built from soilID.input into input/soil_id.dat, flat
#     (j*nx+i)*nz+k (ny=1 -> i*nz+k), with row r of soilID.input = layer k=r
#     (k=0 = top/surface, matching frehg2's vertical index). Layout: id 0 =
#     high-K background (Ks 2.70e-3); id 1 = a sloping low-K lens dipping right
#     and down (Ks 6.94e-6); id 2 = a near-surface low-K block, cols ~40-60,
#     top ~28 layers (Ks 2.78e-7).
#   - gw scheme: SERGHEI gw_scheme 1 (PCA) -> pca.
#   - Surface forcing: sw.input initialMode dry, manning n=0.0036. Driven by
#     rainfall.input (50 mm/h for 3 h, then dry to 12 h; mm/h -> m/s /3.6e6,
#     h -> s) plus the coupled exchange.
#   - Surface BC (extbc.input): "outlet", bctype 5, direction (-1,0) = -x edge
#     (i=0), polygon.input covers cell i=0 -> kind outflow (free/transmissive
#     outfall), target surface.
#   - GW BCs (gwbc.input): only "surface" (dir 6, bctype 8) = coupled top ->
#     coupler owns it, NO explicit BC (plan §5.7). All other faces are no-flow
#     (SERGHEI BCtype REFLECTIVE) = frehg2 default -> no bottom/side BC needed.
#   - IC: subsurface initialMode 4 (file-wt) -> groundwater.water_table from
#     wt.input (2D raster; water table at the domain bottom). Surface
#     initialMode dry -> eta far below the bed.
#   - specific_storage: not in the SERGHEI input; set 1e-5 (schema requires it,
#     b5 value).
#   - CAVEATS: (1) semi-implicit surface solver differs from SERGHEI's explicit
#     SWE. (2) SERGHEI dynamically switches the top BC between ponding and
#     seepage; frehg2 approximates this with its built-in coupler. (3) strongly
#     heterogeneous soils (K ratio ~1e4) stress the coupled front.
# ============================================================================
simulation:
  id: swere-superslab
  title: Coupled heterogeneous superslab infiltration/return flow (SERGHEI case5, 12 h)

domain:
  nx: 100
  ny: 1
  nz: 100
  dx: 1.0
  dy: 1.0
  dz: 0.05            # height 5.0 / ndepth 100 (see notes; dz_base 1.0 stale)
  dz_stretch: 1.0
  bottom_elevation: {file: input/dem.dat}
  follow_terrain: true
  terrain_layers: uniform
  decomposition: {mpi_nx: auto, mpi_ny: auto}

time:
  dt: 0.5             # sync common-step initial value (clamped to gw bounds)
  t_end: 43200.0      # 12 h (SERGHEI simLength)
  output_interval: 1800  # SERGHEI outFreq (30 min)

modules:
  surface_water: true
  groundwater: true
  transport: false

surface_water:
  gravity: 9.81
  friction:
    law: manning
    coefficient: {constant: 0.0036}
  viscosity: {x: 1.0e-06, y: 1.0e-06}
  min_depth: 1.0e-06          # SERGHEI dryDepth
  wetting_face_depth: 1.0e-06
  rainfall:
    series: {file: input/rain.dat}
  evaporation: {constant: 0.0}

groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 0.001    # SERGHEI dt_init (also minimum)
    dt_min: 0.001
    dt_max: 5.0       # SERGHEI dt_max
  specific_storage: 1.0e-05

soil:
  types:
    - name: background   # vg.input soil 0 (high K)
      ksx: 2.70e-03
      ksy: 2.70e-03
      ksz: 2.70e-03
      theta_s: 0.1
      theta_r: 0.02
      vg_alpha: 6.0
      vg_n: 2.0
      aev: 0.0
    - name: lens         # vg.input soil 1
      ksx: 6.94e-06
      ksy: 6.94e-06
      ksz: 6.94e-06
      theta_s: 0.1
      theta_r: 0.03
      vg_alpha: 1.0
      vg_n: 3.0
      aev: 0.0
    - name: block        # vg.input soil 2 (very low K)
      ksx: 2.78e-07
      ksy: 2.78e-07
      ksz: 2.78e-07
      theta_s: 0.1
      theta_r: 0.03
      vg_alpha: 1.0
      vg_n: 3.0
      aev: 0.0
  map: {file: input/soil_id.dat}

coupling: {mode: subcycled}

initial_conditions:
  surface:
    eta: {constant: -10.0}       # dry start (SERGHEI initialMode dry)
  groundwater:
    water_table: {file: input/wt.dat}   # SERGHEI initialMode 4 (file-wt)

boundary_conditions:
  - name: outlet
    region: {polygon: [[-0.1, -0.1], [0.95, -0.1], [0.95, 1.1], [-0.1, 1.1]]}
    target: surface
    kind: outflow          # extbc bctype 5, -x edge (i=0)

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth, seepage]
    groundwater: [hydraulic_head, water_content]
  monitors:
    - {name: outlet, i: 0, j: 0, variables: [depth, eta]}
  checkpoint: {interval: 0}
