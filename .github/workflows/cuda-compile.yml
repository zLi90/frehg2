# p4 — device build integrity (v2 plan §2B.3): build the Kokkos CUDA
# backend, a Kokkos+CUDA PETSc, and every Frehg2 library, the executable,
# AND the test binaries with nvcc — compile and LINK, zero warnings, on a
# GPU-less runner. Nothing executes — the lane proves the kernels are free
# of host-pointer capture and host-only constructs (plan §11.1 rule 8), the
# backend-consistency invariants hold (§2B.2 B1/B5), and linkage against the
# device PETSc/hypre closes. Runtime GPU validation is the owner-executed p6
# bundle (scripts/gpu_acceptance.sh); until it returns, GPU lanes are
# 'experimental' (§2B.4).
#
# Watch this lane's first runs closely: it was authored before the project
# had CI history (amendment A22 / report-P5.md), and the runner image's
# nvcc/host-gcc pairing changes over time.
name: cuda-compile

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cuda-compile-only:
    runs-on: ubuntu-24.04
    env:
      DEPS_PREFIX: /home/runner/.frehg-deps-cuda
      # nvcc 12.6 (installed below) officially supports host gcc <= 13.2;
      # noble's default g++ is 13.3, so pin the wrapper to the hard-supported
      # g++-12 from apt.
      NVCC_WRAPPER_DEFAULT_COMPILER: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 mpich \
            libmpich-dev libhdf5-mpich-dev libyaml-cpp-dev

      # CUDA 12.6 from NVIDIA's official ubuntu2404 apt repository. The image's
      # apt nvidia-cuda-toolkit is CUDA 12.0 (nvcc 12.0.140), below Kokkos
      # 5.1.0's C++20 floor of nvcc 12.2 — its configure hard-fails. The
      # keyring deb is sha256-pinned; the packages it admits are then
      # GPG-verified by apt against NVIDIA's signing key. cuda-toolkit-12-6 is
      # the full metapackage (compiler + every dev library PETSc's --with-cuda
      # probes: cudart, cublas, cusparse, cusolver, cufft).
      - name: Install CUDA 12.6 (apt CUDA 12.0 is below Kokkos 5.1's nvcc floor)
        run: |
          curl -fsSL --retry 5 -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo "d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  /tmp/cuda-keyring.deb" | sha256sum -c -
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          /usr/local/cuda-12.6/bin/nvcc --version

      # Noble's apt mpich launches every rank as a size-1 singleton (PMIx/hydra
      # PMI mismatch, Launchpad #2072338). This lane never executes, but the
      # PETSc dependency build DOES compile/link against libmpich-dev, so it
      # gets the same fixed 4.2.0-5.1 for header/library consistency with the
      # other lanes. See scripts/ci_fix_mpich_noble.sh.
      - name: Fix noble's broken MPICH (PMIx/hydra mismatch)
        run: scripts/ci_fix_mpich_noble.sh

      - name: Cache built dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: frehg-deps-${{ runner.os }}-cuda12-kokkos5.1.0-petsc3.25.1-kokkoskernels-v7

      - name: Build Kokkos (CUDA backend) and PETSc (Kokkos + CUDA)
        run: |
          export CC=gcc-12 CXX=g++-12
          FREHG_CUDA=1 scripts/ci_install_deps.sh "$DEPS_PREFIX"

      - name: Compile and link Frehg2 + tests with nvcc (p4; zero warnings, no execution)
        run: |
          export CMAKE_PREFIX_PATH="$DEPS_PREFIX"
          # PETSc's CUDA build links the toolkit's STUB libraries by design
          # (config/packages/cuda.py stubliblist: "enables compiles on non-GPU
          # nodes", deliberately without an rpath to the stubs dir), so
          # libpetsc.so carries DT_NEEDED entries for driver sonames — here
          # libnvidia-ml.so.1 (NVML; nvml.h/nvmlInit_v2 are hard requirements
          # of PETSc's cuda package, not optional). On a GPU machine the
          # driver provides that soname; this runner has no driver, and the
          # toolkit ships only the UNVERSIONED stub libnvidia-ml.so — so ld,
          # chasing libpetsc.so's dependencies at executable link time, finds
          # no file named libnvidia-ml.so.1 and errors on the nvml symbols.
          # Alias the stubs under their sonames in a scratch dir and expose it
          # via LD_LIBRARY_PATH, which is in ld's documented search order for
          # needed-by-shared-library resolution. Link-time only: nothing in
          # this lane executes, no rpath to the stubs lands in any binary, and
          # the toolkit tree itself is not modified.
          CUDA_STUBS=/usr/local/cuda-12.6/lib64/stubs
          test -e "$CUDA_STUBS/libnvidia-ml.so" || { echo "FATAL: nvml stub missing at $CUDA_STUBS" >&2; exit 1; }
          SONAME_DIR="$RUNNER_TEMP/cuda-stub-sonames"
          mkdir -p "$SONAME_DIR"
          ln -sf "$CUDA_STUBS/libnvidia-ml.so" "$SONAME_DIR/libnvidia-ml.so.1"
          ln -sf "$CUDA_STUBS/libcuda.so" "$SONAME_DIR/libcuda.so.1"
          export LD_LIBRARY_PATH="$SONAME_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -B build-cuda \
            -DCMAKE_CXX_COMPILER="$DEPS_PREFIX/bin/nvcc_wrapper" \
            -DFREHG_WERROR=ON \
            -DFREHG_BACKEND=cuda \
            -DFREHG_ENABLE_TESTS=ON
          cmake --build build-cuda -j "$(getconf _NPROCESSORS_ONLN)"
