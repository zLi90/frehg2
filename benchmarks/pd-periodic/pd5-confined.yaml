# pd5 — periodic groundwater analytic gate (Stage-3 plan §7, T3). A fully
# saturated confined 6 x 10 x 5 block (side heads above the surface),
# periodic in x: the steady head is linear in y and uniform in x, every
# x face carries zero flux, and q_y equals the Darcy value per column —
# the matrix-connectivity gate of plan pitfall §4.4(1). Two lanes:
# uniform K, and K varying by x-column (periodic by construction), which
# must give the SAME solution (no x gradient exists to drive x flow).
#
# THE domain.periodic KEY IS THE T3 TARGET SCHEMA (gate-first, plan §2.3).
simulation:
  id: pd5-confined
  title: Stage-3 pd5 periodic confined Darcy profile

domain:
  nx: 6
  ny: 10
  nz: 5
  dx: 1.0
  dy: 1.0
  dz: 0.5
  bottom_elevation: {constant: 2.5}
  periodic: {x: true}

time:
  dt: 60.0
  t_end: 3600.0
  output_interval: 1800.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 60.0
    dt_min: 60.0
    dt_max: 60.0
  specific_storage: 1.0e-5
  reallocation: legacy          # saturated regime: the legacy restore applies

soil:
  types:
    - name: aquifer
      ksx: 1.0e-5
      ksy: 1.0e-5
      ksz: 1.0e-5
      theta_s: 0.41
      theta_r: 0.05
      vg_alpha: 2.0
      vg_n: 1.8
  map: {constant: aquifer}

initial_conditions:
  groundwater:
    water_table: {constant: 2.9}

boundary_conditions:
  - name: head-south
    region: {polygon: [[-1.0, -1.0], [7.0, -1.0], [7.0, 1.0], [-1.0, 1.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 3.0}}
  - name: head-north
    region: {polygon: [[-1.0, 9.0], [7.0, 9.0], [7.0, 11.0], [-1.0, 11.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 2.8}}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, qx, qy]
