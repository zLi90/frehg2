# pd1 — translational-invariance / wind-friction balance gate (Stage-3
# plan §7, phase T3). An 8 x 4 flat channel (h = 0.5 m), periodic in x,
# velocity-0 walls on the y edges, uniform along-shore wind u10 = 10 m/s
# (Garratt): with no x boundary there is no along-shore pressure gradient,
# so the steady along-shore current is the pure wind-friction balance —
# the gate recomputes the DISCRETE closed form (gate_periodic.py: Garratt
# Cd recomputed independently, the point-implicit double drag factor, the
# relative-wind stress) and asserts eta flatness, u uniformity, the
# balance value, and trailing-window steadiness, on the strict solver (a
# default-solver lane records the bjacobi-ICC translation asymmetry, the
# T10c class). The transposed lane (periodic y, v10) is generated by the
# harness from this file. t_end = 4400 s ~ 40 friction relaxation times
# (t_r = h^(4/3)/(2 g n^2 u) ~ 109 s).
#
# THE domain.periodic KEY IS THE T3 TARGET SCHEMA (gate-first, plan §2.3):
# frehg --validate rejects this file until W3.1 lands.
simulation:
  id: pd1-alongshore
  title: Stage-3 pd1 periodic along-shore wind-friction balance

domain:
  nx: 8
  ny: 4
  nz: 1
  dx: 10.0
  dy: 10.0
  dz: 1.0
  bottom_elevation: {constant: -0.5}
  periodic: {x: true}

time:
  dt: 2.0
  t_end: 4400.0
  output_interval: 110.0

modules:
  surface_water: true

surface_water:
  gravity: 9.81
  friction:
    law: manning
    coefficient: {constant: 0.05}
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 1.0e-05
  wind:
    enabled: true
    law: garratt
    cap: 0.0035
    u10: {constant: 10.0}
    v10: {constant: 0.0}

initial_conditions:
  surface:
    eta: {constant: 0.0}

boundary_conditions:
  - name: wall-south
    region: {polygon: [[-1.0, -1.0], [81.0, -1.0], [81.0, 10.0], [-1.0, 10.0]]}
    target: surface
    kind: velocity
    value: {constant: 0.0}
  - name: wall-north
    region: {polygon: [[-1.0, 30.0], [81.0, 30.0], [81.0, 41.0], [-1.0, 41.0]]}
    target: surface
    kind: velocity
    value: {constant: 0.0}

output:
  filename: out/output.h5
  variables:
    surface: [eta, uu, vv]
  monitors:
    - {name: p_mid, i: 4, j: 2, variables: [uu, eta]}
