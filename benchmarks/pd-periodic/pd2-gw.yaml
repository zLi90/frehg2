# pd2-gw — seam-invariance (roll) gate, groundwater lane (Stage-3 plan §7,
# phase T3). A 12 x 6 x 8 block, periodic in x, with an exactly-periodic
# quantized K(x, y) modulation (8 soil types), y-side water tables and a
# uniform infiltration: the roll identity exercises the groundwater matrix
# wrap (COO legs through the gid halo), the side-code and edge-flux TOPO
# conversions, and the audit's boundary accounting. Same harness contract
# as pd2-surface (rolled inputs, strict solver).
#
# THE domain.periodic KEY IS THE T3 TARGET SCHEMA (gate-first, plan §2.3).
simulation:
  id: pd2-gw
  title: Stage-3 pd2 groundwater roll invariance across the seam

domain:
  nx: 12
  ny: 6
  nz: 8
  dx: 5.0
  dy: 5.0
  dz: 0.25
  bottom_elevation: {constant: 2.0}
  periodic: {x: true}

time:
  dt: 600.0
  t_end: 86400.0
  output_interval: 21600.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 60.0
    dt_min: 1.0
    dt_max: 600.0
  specific_storage: 1.0e-5
  reallocation: disabled        # the vadose-conservative mode (T1)

soil:
  types:
    - {name: k0, ksx: 5.0e-6, ksy: 5.0e-6, ksz: 5.0e-6, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k1, ksx: 7.0e-6, ksy: 7.0e-6, ksz: 7.0e-6, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k2, ksx: 9.0e-6, ksy: 9.0e-6, ksz: 9.0e-6, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k3, ksx: 1.1e-5, ksy: 1.1e-5, ksz: 1.1e-5, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k4, ksx: 1.3e-5, ksy: 1.3e-5, ksz: 1.3e-5, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k5, ksx: 1.5e-5, ksy: 1.5e-5, ksz: 1.5e-5, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k6, ksx: 1.7e-5, ksy: 1.7e-5, ksz: 1.7e-5, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
    - {name: k7, ksx: 1.9e-5, ksy: 1.9e-5, ksz: 1.9e-5, theta_s: 0.41, theta_r: 0.05, vg_alpha: 2.0, vg_n: 1.8}
  map: {file: input/pd2_soil_id.dat}

initial_conditions:
  groundwater:
    water_table: {constant: 1.2}

boundary_conditions:
  - name: inland-head
    region: {polygon: [[-1.0, -1.0], [61.0, -1.0], [61.0, 5.0], [-1.0, 5.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 1.5}}
  - name: sea-head
    region: {polygon: [[-1.0, 25.0], [61.0, 25.0], [61.0, 31.0], [-1.0, 31.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 1.0}}
  - name: recharge
    region: {polygon: [[-1.0, -1.0], [61.0, -1.0], [61.0, 31.0], [-1.0, 31.0]]}
    target: groundwater_top
    kind: flux
    value: {constant: -1.0e-7}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, water_content, qx, qy, qz]
