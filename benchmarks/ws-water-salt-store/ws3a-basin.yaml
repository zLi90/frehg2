# ws3(a) — rain/evaporation invariance (Stage-3 plan §12A, O15 R1): a closed
# 4 x 4 basin, 0.2 m at 35 psu, never dries; rain 1e-5 m/s for 2000 s with
# legacy prescribed evaporation 5e-6 m/s throughout (dilution to ~33.3 psu,
# concentration back to ~35). The store must change nothing: the harness
# runs this file (surface_dryout: store) and a discard twin and asserts the
# fields bitwise equal.
simulation:
  id: ws3-ws3a
  title: Stage-3 ws3a rain/evaporation invariance
domain:
  nx: 4
  ny: 4
  nz: 1
  dx: 1.0
  dy: 1.0
  dz: 1.0
  bottom_elevation:
    constant: 0.0
time:
  dt: 10.0
  t_end: 4000.0
  output_interval: 200.0
modules:
  surface_water: true
  transport: true
surface_water:
  friction:
    law: manning
    coefficient:
      constant: 0.03
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 1.0e-05
  rainfall:
    series:
      file: input/ws3_rain.dat
  evaporation:
    constant: 5.0e-06
transport:
  scheme:
    advection: superbee
  dispersion:
    longitudinal: 0.0
    transverse: 0.0
    molecular: 0.0
  surface_update: consistent
  surface_dryout: store
boundary_conditions:
- name: walls
  region:
    polygon:
    - - -1
      - -1
    - - 5
      - -1
    - - 5
      - 5
    - - -1
      - 5
  target: surface
  kind: velocity
  value:
    constant: 0.0
initial_conditions:
  surface:
    eta:
      constant: 0.2
  transport:
    surface:
      constant: 35.0
output:
  filename: out/output.h5
  monitor_interval: 0
  variables:
    surface:
    - eta
    - depth
    transport:
    - concentration_surface
