# ws1 — paired water–salt store source bound (Stage-3 plan §12A, T9; S3-A12
# compressed). A 2-D (nx = 1) 12.5 % beach (+2.0 m to -0.8 m) and a 1 %
# terrace, a 0.5 m / 2-h tide through the external closure, the H2
# heterogeneous log-K window (24 bins, iid, seed 20261031) over the base
# K_g, a Ghyben-Herzberg initial interface, density coupling with the
# density gradient, legacy reallocation + redistribute, subcycled 0.5 s /
# <= 5 s, min_depth 1e-5, consistent updates, NO ET. Over the ebb the dry
# seepage face below the water-table exit receives post-allocation vents
# just above min_depth — the S3-A12 mechanism. Inputs: input/gen_inputs.py.
#
# Red (T8 binary, records/T9/red/ws1-T8.log): surface 494 psu, subsurface
# 35.006 psu (films of 1.1e-5 m at low water carrying a salt-only store);
# the discard control stays at 35.000. Asserts (run_regression.py ws1):
# max surface and subsurface salinity <= 35 (1 + 1e-12) at every frame and
# monitor row; M_s <= 35 V_s per cell (I2); zero clip warnings and CFL
# within the legacy release-onset bound (S3-A13); anti-vacuity floors on
# the parked volume and the release count; the ws2 ledgers on this lane
# and its discard twin. Budget <= 30 s (measured 16 s).
simulation:
  id: ws1-source-bound
  title: Stage-3 ws1 paired-store source bound (S3-A12 seepage face, compressed)
domain:
  nx: 1
  ny: 64
  nz: 16
