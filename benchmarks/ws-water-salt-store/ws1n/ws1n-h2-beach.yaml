# ws1n — the S3-A12 repro as the nightly source-bound lane (Stage-3 plan
# §12A, T9): the 2026Frehg2 v30 2-D H2 tidal beach without ET (1 x 160 x 40,
# 12.5 % beach + 1 % terrace, external-closure M2 tide 1 m, 35 psu,
# consistent updates, density coupling with the density gradient, legacy
# reallocation + redistribute, subcycled 0.5 s / <= 5 s, min_depth 1e-5,
# 25-type heterogeneous K), 0 -> 28 800 s. Inputs copied verbatim from the
# owner's bug report (stage3/evidence/dryout-store/input). Red on the T8
# binary: 72 854 psu surface, 9 039 psu subsurface, 47 CFL warnings (max
# 81; records/T9/red/ws1n-T8.log). Asserts: as ws1.
