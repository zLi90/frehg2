# pcr-box — Stage-3 T11 §12C pc-x rank base: the pc0(a)-class saturated
# heterogeneous box (24 Ks classes over 3 decades, every face a contrast)
# as a runnable case, driven by opposing side water tables. Used by the
# pc_rank gate at mpi_ny 1/2/4 under the strict solver, and by the
# pc-restart lane. K1's churn assert runs on it through pc1's check.
simulation:
  id: pcr-box
  title: Stage-3 pcr saturated heterogeneous box (rank/restart base)
domain:
  nx: 4
  ny: 4
  nz: 6
  dx: 1.0
  dy: 1.0
  dz: 0.5
  bottom_elevation: {constant: 3.0}
time:
  dt: 30.0
  t_end: 7200.0
  output_interval: 720.0
modules:
  groundwater: true
groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 30.0
    dt_min: 30.0
    dt_max: 30.0
  specific_storage: 1.0e-05
  reallocation: legacy
  predictor_corrector: consistent
