# pc2-h0-beach — Stage-3 T11 §12C: the v30 H0 study lane packaged as a gate
# (cold start, 0 -> T/4 = 11178 s; from stage3/evidence/ks-face/repro/base_H0.yaml
# with the repro's lane transforms + groundwater.predictor_corrector: consistent).
# Homogeneous control; doubles as pc6(c), the H0 residual-creation record (stock 0.021 m^3/m per cycle at T/4 scale).
# c_H0_2D_U00 -- generated by tools/gen_cases_v30.py (design v30); DO NOT EDIT, re-run the generator.
# needs FREHG2 3.0.0 with Stage-3 T9/T10 (keys: inflow.closure, domain.periodic, surface_update conservative, surface_dryout (paired store), reallocation, seepage_rate, film_removal_rate, water_store, monitor_interval)
# SEGMENT 1/4 of: RUN: cold start, 0 -> 40 T (t_end 1788480 s), wind on from t = 0, output every 11178 s = T/4
# segment: 0 T -> 10 T (t 0 -> 447120 s), writes out/seg01.h5
# heterogeneity H0; 2D section (nx = 1, x walls); wind: off (control branch)
# profile: beach z = 0.125 (32 - y) for y <= 44 m (toe z = -1.50), terrace slope 0.010 to y = 80 m (z = -1.86); bed 4.00 m at y = 0
# tide: eta = 0 + 1 sin(2 pi t / 44712 s), external still-sea closure; HW/MSL/LW lines y = 24/32/40 m
# aquifer: scaled nz 40 to the flat base -14.00 m (column 17.97 .. 12.14 m, top layer 0.149 .. 0.101 m); window = layers 1..25 (7.10 .. 4.80 m), mud cap = layers 1..8 (1.42 .. 0.96 m), basement K_g
# window lnK: target mean -9.460794 var 0.836703 (K_g 7.784475e-05 m/s); this map: mean -9.460794 var 0.000000 (1 soil types)
# inland hydraulic head 0.60 m (fresh); seaward side hydrostatic MSL, 35 psu; eps = 0.02604
# surface water: horizontal mixing K_h = 0.1 m2/s (transport.surface_diffusivity); surface_update conservative, surface_dryout store
# IC (identical for every case): salinity step front at y = 44 m (35 psu seaward at every depth, fresh landward); water table: tidal-mean water table of p_H0_2D/out/output.h5; surface water at MSL, 35 psu where the bed < MSL
# note: cold start from the step-front IC, wind on from t = 0
simulation:
  id: c_H0_2D_U00
  title: 'FREHG2 3.0.0 tide x wind x heterogeneity v30: H0 2D no wind'
domain:
  nx: 1
  ny: 160
  nz: 40
  dx: 1.0
  dy: 0.5
  dz: 0.14874820845219125
  dz_stretch: 1.05
  bottom_elevation: {file: input/dem.dat}
  follow_terrain: true
  terrain_layers: scaled
time:
  dt: 0.5
  t_end: 11178
  output_interval: 5589
modules:
  surface_water: true
  groundwater: true
  transport: true
surface_water:
  gravity: 9.81
  friction:
    law: manning
    coefficient: {file: input/manning.dat}
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 0.0005
  wind:
    enabled: false
groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 0.5
    dt_min: 0.01
    dt_max: 5.0
    courant_max: 2.0
  specific_storage: 1.0e-05
  reallocation: legacy
  predictor_corrector: consistent   # T11 (O17): the gate strips this for the red lane
  reallocation_surplus: redistribute
  density_coupling:
    enabled: true
    reallocation_gradient: density
soil:
  types:
  - {name: Kg, ksx: 0.0, ksy: 7.784475161383021e-05, ksz: 7.784475161383021e-05, theta_s: 0.41, theta_r: 0.15, vg_alpha: 2.0,
    vg_n: 1.41}
  map: {constant: Kg}
coupling:
  mode: subcycled
initial_conditions:
  surface:
    eta: {constant: 0.0}
  groundwater:
    water_table: {file: input/wt.dat}
  transport:
    surface: {file: input/ic_salt_surf.dat}
    groundwater: {file: input/ic_salt_gw_step.dat}
boundary_conditions:
- name: tide-eta
  region: {polygon: [[-1.0, 79.625], [2.0, 79.625], [2.0, 81.0], [-1.0, 81.0]]}
  target: surface
  kind: eta
  value: {series: {file: input/tide.dat}}
  inflow:
    closure: external
- name: tide-salt
  region: {polygon: [[-1.0, 79.625], [2.0, 79.625], [2.0, 81.0], [-1.0, 81.0]]}
  target: surface
  kind: scalar_value
  value: {constant: 35.0}
- name: x-walls
  region: {polygon: [[-1.0, -1.0], [2.0, -1.0], [2.0, 79.625], [-1.0, 79.625]]}
  target: surface
  kind: velocity
  value: {constant: 0.0}
- name: inland-head
  region: {polygon: [[-1.0, -1.0], [2.0, -1.0], [2.0, 0.375], [-1.0, 0.375]]}
  target: groundwater_side
  kind: head
  value: {hydrostatic: {eta: 0.6}}
- name: inland-salinity
  region: {polygon: [[-1.0, -1.0], [2.0, -1.0], [2.0, 0.375], [-1.0, 0.375]]}
  target: groundwater_side
  kind: scalar_value
  value: {constant: 0.0}
- name: seaward-head
  region: {polygon: [[-1.0, 79.625], [2.0, 79.625], [2.0, 81.0], [-1.0, 81.0]]}
  target: groundwater_side
  kind: head
  value: {hydrostatic: {eta: 0.0}}
- name: seaward-salinity
  region: {polygon: [[-1.0, 79.625], [2.0, 79.625], [2.0, 81.0], [-1.0, 81.0]]}
  target: groundwater_side
  kind: scalar_value
  value: {constant: 35.0}
transport:
  scheme: {advection: superbee}
  surface_diffusivity: {x: 0.1, y: 0.1}
  dispersion: {longitudinal: 0.002, transverse: 0.0004, molecular: 1.0e-10}
  subsurface_update: consistent
  surface_update: conservative
  surface_dryout: store
output:
  filename: out/output.h5
  monitor_interval: 60
  variables:
    surface: [eta, depth, uu, vv, seepage_rate, film_removal_rate, water_store]
    groundwater: [hydraulic_head, water_content, qx, qy, qz, realloc_created, realloc_dropped, vloss]
    transport: [concentration, concentration_surface, salt_store]
  monitors:
  - {name: p_inland, i: 0, j: 16, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_hw, i: 0, j: 48, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_upper, i: 0, j: 56, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_msl, i: 0, j: 64, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_lower, i: 0, j: 72, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_lw, i: 0, j: 80, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_toe, i: 0, j: 88, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_terrace, i: 0, j: 120, variables: [eta, depth, uu, vv, concentration_surface]}
  - {name: p_sea, i: 0, j: 152, variables: [eta, depth, uu, vv, concentration_surface]}
  checkpoint:
    interval: 5520
