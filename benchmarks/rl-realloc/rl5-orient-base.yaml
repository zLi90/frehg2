# The Stage-3 rl5 vadose 8-orientation battery base (S3-A4). Like the
# x-orient gw block it is square with z-layered soils (invariant under the
# in-plane transforms) and an off-centre single-cell side flux as the
# injectivity probe — but it stays VADOSE throughout (uniform moist IC,
# suction side heads, a flux far below both Ksat values), because that is
# the disabled reallocation mode's domain of applicability: near saturation
# the missing consistency restore amplifies rounding chaotically and no
# strict battery can pass (Reallocate.cpp header; the measured dead ends
# are in amendment S3-A4). The battery harness rewrites nothing here; the
# ctest entry selects reallocation: disabled via FREHG_STAGE3_OVERRIDES,
# and the r1 --expect hook asserts the override reached every run record.
simulation:
  id: rl5-orient
  title: Stage-3 rl5 vadose 8-orientation groundwater battery

domain:
  nx: 12
  ny: 12
  nz: 8
  dx: 0.5
  dy: 0.5
  dz: 0.25
  bottom_elevation: {constant: 2.0}
  follow_terrain: false

time:
  dt: 300.0
  t_end: 12000.0
  output_interval: 12000.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  specific_storage: 1.0e-5
  timestep:
    dt_init: 300.0
    dt_min: 300.0
    dt_max: 300.0

soil:
  types:
    - name: sand
      ksx: 1.0e-4
      ksy: 1.0e-4
      ksz: 1.0e-4
      theta_s: 0.41
      theta_r: 0.05
      vg_alpha: 4.0
      vg_n: 2.5
    - name: silt
      ksx: 1.0e-5
      ksy: 1.0e-5
      ksz: 1.0e-5
      theta_s: 0.45
      theta_r: 0.10
      vg_alpha: 1.0
      vg_n: 1.5
  map: {file: input/orient_soil_id.dat}

initial_conditions:
  groundwater:
    moisture: {constant: 0.18}

boundary_conditions:
  # Side polygons use the x-orient symmetric-overhang convention; the two
  # suction side heads keep every ghost unsaturated, and the single-cell
  # flux (i = 3, centre (1.75, 0.25)) is the y-axis injectivity probe.
  - name: drain-west
    region: {polygon: [[-0.1, -0.1], [0.3, -0.1], [0.3, 6.1], [-0.1, 6.1]]}
    target: groundwater_side
    kind: head
    value: {constant: -1.0}
  - name: drain-east
    region: {polygon: [[5.7, -0.1], [6.1, -0.1], [6.1, 6.1], [5.7, 6.1]]}
    target: groundwater_side
    kind: head
    value: {constant: -2.0}
  - name: side-flux
    region: {polygon: [[1.6, -0.1], [1.9, -0.1], [1.9, 0.3], [1.6, 0.3]]}
    target: groundwater_side
    kind: flux
    value: {constant: 2.0e-6}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, water_content]
