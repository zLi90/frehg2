# rl2 — heterogeneous tidal-box conservation gate (Stage-3 plan §5, phase T1).
# Groundwater-only 8 x 8 x 12 box, surface at z = 3 m, base at z = 0: a
# sand/silt checkerboard (2 x 2 x 3 blocks) with side water tables at
# eta 1.5 (y-) and 1.2 (y+) and four 30-minute infiltration pulses through
# the top face, so wetting fronts cross the heterogeneity into the water
# table — the regime where the legacy post-allocation step is most active
# (the anti-vacuity floor of the gate measures that activity).
#
# THE reallocation KEY AND THE realloc_* OUTPUTS ARE THE T1 TARGET SCHEMA
# (Stage-3 plan W1.1/W1.3, authored gate-first per §2.3): frehg --validate
# rejects this file and the gate FAILS as "capability absent" until the
# capability lands. The gate harness (run_regression.py rl2) runs the
# `legacy` and `off` lanes by rewriting groundwater.reallocation; checks
# and tolerances: tests/regression/tolerances/stage3-rl.yaml, negative
# battery scripts/test_rl_gates.py.
simulation:
  id: rl2-tidal-box
  title: Stage-3 rl2 heterogeneous box, pulsed infiltration into side water tables

domain:
  nx: 8
  ny: 8
  nz: 12
  dx: 1.0
  dy: 1.0
  dz: 0.25
  bottom_elevation: {constant: 3.0}

time:
  dt: 30.0
  t_end: 14400.0
  output_interval: 1800.0

modules:
  groundwater: true

groundwater:
  # S3-A18 pin: the rl2 legacy-churn floor and rl4's anchor comparison
  # measure the LEGACY trajectory (W11.8); the flipped default would
  # erase the churn they assert.
  predictor_corrector: legacy
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 1.0
    dt_min: 0.1
    dt_max: 30.0
  specific_storage: 1.0e-5
  reallocation: legacy          # the gate harness rewrites this per lane

soil:
  types:
    - name: sand
      ksx: 1.0e-4
      ksy: 1.0e-4
      ksz: 1.0e-4
      theta_s: 0.41
      theta_r: 0.05
      vg_alpha: 4.0
      vg_n: 2.5
    - name: silt
      ksx: 1.0e-6
      ksy: 1.0e-6
      ksz: 1.0e-6
      theta_s: 0.45
      theta_r: 0.10
      vg_alpha: 1.0
      vg_n: 1.5
  map: {file: input/soil_map.dat}

initial_conditions:
  groundwater:
    water_table: {constant: 1.3}

boundary_conditions:
  # The side polygons exclude the corner columns (i = 0, 7) so each
  # condition attaches y faces only (BoundarySet attaches every edge face a
  # corner cell touches — the documented v2 corner rule).
  - name: inland-head
    region:
      polygon: [[0.9, -1.0], [7.1, -1.0], [7.1, 0.6], [0.9, 0.6]]
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 1.5}}
  - name: sea-head
    region:
      polygon: [[0.9, 7.4], [7.1, 7.4], [7.1, 9.0], [0.9, 9.0]]
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 1.2}}
  - name: rain-pulses
    region:
      polygon: [[-1.0, -1.0], [9.0, -1.0], [9.0, 9.0], [-1.0, 9.0]]
    target: groundwater_top
    kind: flux
    value: {series: {file: input/top_flux.dat}}

output:
  filename: out/output.h5
  variables:
    groundwater: [water_content, hydraulic_head, realloc_created, realloc_dropped, vloss]
