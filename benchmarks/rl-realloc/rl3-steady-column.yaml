# rl3 — steady-infiltration column gate (Stage-3 plan §5, phase T1).
# 1 x 1 x 40 sand column, 2 m deep, constant infiltration -2e-6 m/s through
# the top face, pressure head 0 at the base: the steady state is a uniform
# downward Darcy flux of 2e-6 m/s through every face. The gate asserts, on
# the `off` lane, steadiness (trailing-window theta span) and flux
# uniformity max_k |qz_k - q_top| / |q_top|, and that the realloc audit
# columns are exactly zero; the `legacy` lane's churn and uniformity are
# recorded (they show whether the theta := theta(h) restore distorts a
# steady front).
#
# THE reallocation KEY IS THE T1 TARGET SCHEMA (gate-first, plan §2.3):
# frehg --validate rejects this file until W1.1 lands. Tolerances:
# tests/regression/tolerances/stage3-rl.yaml.
simulation:
  id: rl3-steady-column
  title: Stage-3 rl3 steady infiltration column, flux uniformity

domain:
  nx: 1
  ny: 1
  nz: 40
  dx: 1.0
  dy: 1.0
  dz: 0.05
  bottom_elevation: {constant: 2.0}

time:
  dt: 600.0
  t_end: 518400.0
  output_interval: 8640.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  timestep:
    dt_init: 60.0
    dt_min: 1.0
    dt_max: 600.0
  specific_storage: 1.0e-5
  reallocation: disabled        # the gate harness rewrites this per lane

soil:
  types:
    - name: sand
      ksx: 1.0e-4
      ksy: 1.0e-4
      ksz: 1.0e-4
      theta_s: 0.41
      theta_r: 0.05
      vg_alpha: 4.0
      vg_n: 2.5
  map: {constant: sand}

initial_conditions:
  groundwater:
    water_table: {constant: 0.0}

boundary_conditions:
  - name: infiltration
    region:
      polygon: [[-1.0, -1.0], [2.0, -1.0], [2.0, 2.0], [-1.0, 2.0]]
    target: groundwater_top
    kind: flux
    value: {constant: -2.0e-6}
  - name: base-head
    region:
      polygon: [[-1.0, -1.0], [2.0, -1.0], [2.0, 2.0], [-1.0, 2.0]]
    target: groundwater_bottom
    kind: head
    value: {constant: 0.0}

output:
  filename: out/output.h5
  variables:
    groundwater: [water_content, hydraulic_head, qz]
