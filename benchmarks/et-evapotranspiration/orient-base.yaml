# orient-base — et-x surface dihedral battery AND rank-invariance base
# (Stage-3 plan §9, T5; trajectory-stabilized under S3-A8). An 8 x 8
# coupled basin (dx = dy = 2 m) on a plane sloping toward the south-west
# corner: a flat eta IC at -0.10 ponds roughly half the domain
# (open-water channel) and exposes the rest (soil channel), salinity 20
# with consistent updates and the store, mild met, sync dt = 10 s,
# 600 s. STABILITY: the 0.1 m bed steps put every cell >= 0.05 m from
# the wet/dry threshold — 5x the documented swe MIXED asymmetry class
# (1e-2) and vastly above the 600 s ET removal (~6e-5 m) — so neither
# rounding nor the legacy mixed edge arithmetic can flip a shoreline
# cell, and the low-K soil (1e-7) keeps the 600 s infiltration at
# ~6e-5 m so the pond edge never drains dry (K = 1e-4 drained the
# shallow edge cells mid-run and their O4 store capture fired at
# front-chaotic instants — store deltas 1.1 across the mixed lanes). The first authoring (eta -0.20, a drying thin rim) was
# front-chaotic (the 1e-12 twin reproduced the deltas: tracer 1.4e2),
# and the second (0.04-step bed, 0.01 margins) flipped shoreline cells
# under exactly the mixed 1e-2 class; et9 keeps the wet/dry-front
# physics under its trajectory-robust assertions.
# Run by regression.s3.et-orient (dihedral battery, scalar fields, the
# pd8/S3-A6 conventions) and regression.s3.et-rank (n = 1/2/4).
simulation:
  id: etx-orient-base
  title: Stage-3 et-x ET orientation base

domain:
  nx: 8
  ny: 8
  nz: 6
  dx: 2.0
  dy: 2.0
  dz: 0.1
  bottom_elevation: {file: input/etx_dem.dat}
  follow_terrain: true
  terrain_layers: uniform

time:
  dt: 10.0
  t_end: 600.0
  output_interval: 600.0

modules:
  surface_water: true
  groundwater: true
  transport: true

surface_water:
  friction:
    law: manning
    coefficient: {constant: 0.03}
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 1.0e-03

groundwater:
  timestep: {dt_init: 10.0, dt_min: 10.0, dt_max: 10.0}
  specific_storage: 1.0e-5
  reallocation: disabled

soil:
  types:
    - {name: mudflat, ksx: 1.0e-7, ksy: 1.0e-7, ksz: 1.0e-7,
       theta_s: 0.41, theta_r: 0.05, vg_alpha: 4.0, vg_n: 2.5}
  map: {constant: mudflat}

coupling: {mode: sync}

atmosphere:
  air_temperature: {constant: 20.0}
  surface_temperature: {constant: 20.0}
  pressure: {constant: 101.3}
  relative_humidity: {constant: 0.6}
  wind_speed: {constant: 2.0}
  wind_speed_floor: 0.5

evapotranspiration:
  potential: bulk
  open_water: true
  soil:
    limiter: alpha_barton

transport:
  scheme: {advection: superbee}
  dispersion: {longitudinal: 0.0, transverse: 0.0, molecular: 1.0e-9}
  surface_update: consistent
  subsurface_update: consistent
  surface_dryout: store

initial_conditions:
  surface:
    eta: {constant: -0.10}
  groundwater:
    water_table: {constant: -0.30}
  transport:
    surface: {constant: 20.0}
    groundwater: {constant: 20.0}

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth]
    groundwater: [water_content]
    transport: [concentration_surface, salt_store]
