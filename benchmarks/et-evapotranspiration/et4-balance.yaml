# et4 — the ET water balance, E lane (Stage-3 plan §9, T5; the T lane
# arrives in T6; horizon amended by S3-A8): a closed 1 x 1 x 30 silt
# column, uncoupled, ET soil channel only, 12 h, reallocation disabled.
# The storage change equals the applied evaporation exactly (DeltaS =
# -integral qVap A dt = the soil_evaporation audit column = boundary_in),
# vloss stays identically zero and unrealised books demand - applied.
# The plan's 3-day horizon drove the column into the van Genuchten dry
# singularity (theta -> theta_r everywhere; the 2026-10-28 measurement:
# Ss phantom release 0.148 m^3, vloss 0.038 m^3, books still exact) — a
# PRE-EXISTING Richards domain limit (the legacy guarded path reaches
# the same state with no cap at all), the S3-A4 domain-of-applicability
# class. The gate holds the regular regime; the cap anti-vacuity lives
# in et7.
simulation:
  id: et4-balance
  title: Stage-3 et4 soil-evaporation water balance

domain:
  nx: 1
  ny: 1
  nz: 30
  dx: 1.0
  dy: 1.0
  dz: 0.02
  bottom_elevation: {constant: 0.6}

time:
  dt: 600.0
  t_end: 43200.0
  output_interval: 3600.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  timestep: {dt_init: 60.0, dt_min: 1.0, dt_max: 600.0}
  specific_storage: 1.0e-5
  reallocation: disabled

soil:
  types:
    - {name: silt, ksx: 1.0e-6, ksy: 1.0e-6, ksz: 1.0e-6,
       theta_s: 0.45, theta_r: 0.067, vg_alpha: 1.6, vg_n: 1.37}
  map: {constant: silt}

atmosphere:
  air_temperature: {constant: 25.0}
  surface_temperature: {constant: 30.0}
  pressure: {constant: 101.3}
  relative_humidity: {constant: 0.3}
  wind_speed: {constant: 8.0}
  wind_speed_floor: 0.5

evapotranspiration:
  potential: bulk
  open_water: false
  soil:
    limiter: alpha_barton

initial_conditions:
  groundwater:
    head: {constant: -0.3}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, water_content, vloss]
    atmosphere: [soil_evaporation_rate, soil_evaporation_unrealised_rate]
