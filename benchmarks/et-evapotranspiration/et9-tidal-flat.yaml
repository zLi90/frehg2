# et9 — the coupled tidal-flat smoke (Stage-3 plan §9, T5): everything
# at once. A 4 x 24 periodic-x strip (dx = dy = 2 m) whose bed drops
# from +0.38 m (supratidal) through the intertidal band to -0.54 m
# (subtidal), a north tide stage 0.3 sin(2 pi t / 3600) entering through
# the T2 external closure, a 12-layer sand subsurface (dz 0.1, stretch
# 1.1), inland/seaward side heads, salinity 35 (sea) / 0 (inland) with
# consistent updates and the salt store, the full et-met demand,
# subcycled dt = 2 s / dtg <= 10 s, 3 tidal cycles. The zone assertions
# (sub/supra/intertidal), the time-basis complementarity, both ledgers
# and the ET/noET substep ratio are checked by the harness; the noET
# lane (this file without the ET block) is pinned bitwise against its
# T5-START hashes recorded on the T4 binary.
simulation:
  id: et9-tidal-flat
  title: Stage-3 et9 evaporating tidal flat smoke

domain:
  nx: 4
  ny: 24
  nz: 12
  dx: 2.0
  dy: 2.0
  dz: 0.1
  dz_stretch: 1.1
  bottom_elevation: {file: input/et9_dem.dat}
  follow_terrain: true
  terrain_layers: uniform
  periodic: {x: true}

time:
  dt: 2.0
  t_end: 10800.0
  output_interval: 60.0

modules:
  surface_water: true
  groundwater: true
  transport: true

surface_water:
  friction:
    law: manning
    coefficient: {constant: 0.03}
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 1.0e-03

groundwater:
  # S3-A18 pin: paired with et9-noet's bitwise trajectory (W11.8).
  predictor_corrector: legacy
  timestep: {dt_init: 2.0, dt_min: 1.0, dt_max: 10.0}
  specific_storage: 1.0e-5
  reallocation: disabled

soil:
  types:
    - {name: sand, ksx: 1.0e-4, ksy: 1.0e-4, ksz: 1.0e-4,
       theta_s: 0.41, theta_r: 0.05, vg_alpha: 4.0, vg_n: 2.5}
  map: {constant: sand}

coupling: {mode: subcycled}

atmosphere:
  air_temperature: {constant: 25.0}
  surface_temperature: {constant: 30.0}
  pressure: {constant: 101.3}
  relative_humidity: {constant: 0.3}
  wind_speed: {constant: 8.0}
  wind_speed_floor: 0.5

evapotranspiration:
  potential: bulk
  open_water: true
  soil:
    limiter: alpha_barton

transport:
  scheme: {advection: superbee}
  dispersion: {longitudinal: 0.0, transverse: 0.0, molecular: 1.0e-9}
  surface_update: consistent
  subsurface_update: consistent
  surface_dryout: store

boundary_conditions:
  - name: tide-north
    region: {polygon: [[-1.0, 45.9], [9.0, 45.9], [9.0, 49.0], [-1.0, 49.0]]}
    target: surface
    kind: eta
    value: {series: {file: input/et9_tide.dat}}
    inflow:
      closure: external
  - name: inland-gw
    region: {polygon: [[-1.0, -1.0], [9.0, -1.0], [9.0, 1.9], [-1.0, 1.9]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 0.2}}
  - name: sea-gw
    region: {polygon: [[-1.0, 46.1], [9.0, 46.1], [9.0, 49.0], [-1.0, 49.0]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 0.0}}
  - name: sea-salt
    region: {polygon: [[-1.0, 45.9], [9.0, 45.9], [9.0, 49.0], [-1.0, 49.0]]}
    target: surface
    kind: scalar_value
    value: {constant: 35.0}
  - name: inland-salt
    region: {polygon: [[-1.0, -1.0], [9.0, -1.0], [9.0, 1.9], [-1.0, 1.9]]}
    target: groundwater_side
    kind: scalar_value
    value: {constant: 0.0}

initial_conditions:
  surface:
    eta: {constant: 0.0}
  groundwater:
    water_table: {constant: 0.0}
  transport:
    surface: {constant: 35.0}
    groundwater: {constant: 35.0}

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth, seepage_rate]
    groundwater: [hydraulic_head, water_content]
    transport: [concentration, concentration_surface, salt_store]
    atmosphere: [evaporation_rate, soil_evaporation_rate, wet_time, soil_evaporation_time]
