# et1 — new ET block vs the v2.0 bulk-soil path (Stage-3 plan §9, T5).
# A 1 x 1 x 30 uncoupled sand column (dz 0.02, 0.6 m), unsaturated start
# (h = -0.5 m uniform), MILD met so the supply cap never binds, fixed
# dtg = 60 s, 1 day, reallocation disabled. The harness runs this file
# (the NEW path: evapotranspiration{bulk, soil, alpha_barton}) and an
# old-path variant it generates (groundwater.evaporation{mode: bulk}):
# the uncoupled legacy flux branches carry no moisture guard on either
# side (Predictor/Corrector), alpha_barton copies the w_g surface
# extrapolation verbatim and the unbinding cap leaves qVap = E_s, so the
# two paths must agree BITWISE on every output (lane a). The D1
# guard-mismatch lane lives in et1b-coupled.yaml (S3-A8: the guards are
# coupled-mode-0-only, so an uncoupled saturated lane cannot reach D1).
#
# THE evapotranspiration BLOCK IS THE T5 TARGET SCHEMA (gate-first, plan
# §2.3): frehg --validate rejects this file until W5.1 lands.
simulation:
  id: et1-column
  title: Stage-3 et1 ET soil channel vs the v2.0 bulk path

domain:
  nx: 1
  ny: 1
  nz: 30
  dx: 1.0
  dy: 1.0
  dz: 0.02
  bottom_elevation: {constant: 0.6}

time:
  dt: 60.0
  t_end: 86400.0
  output_interval: 3600.0

modules:
  groundwater: true

groundwater:
  scheme: pca
  use_full3d: true
  timestep: {dt_init: 60.0, dt_min: 60.0, dt_max: 60.0}
  specific_storage: 1.0e-5
  reallocation: disabled

soil:
  types:
    - {name: sand, ksx: 1.0e-4, ksy: 1.0e-4, ksz: 1.0e-4,
       theta_s: 0.41, theta_r: 0.05, vg_alpha: 4.0, vg_n: 2.5}
  map: {constant: sand}

atmosphere:
  air_temperature: {constant: 20.0}
  surface_temperature: {constant: 20.0}
  pressure: {constant: 101.3}
  relative_humidity: {constant: 0.6}
  wind_speed: {constant: 2.0}
  wind_speed_floor: 0.5

evapotranspiration:
  potential: bulk
  open_water: false
  soil:
    limiter: alpha_barton

initial_conditions:
  groundwater:
    head: {constant: -0.2}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, water_content]
