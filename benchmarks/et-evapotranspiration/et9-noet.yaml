simulation:
  id: et9-tidal-flat-noet
  title: Stage-3 et9 evaporating tidal flat smoke
domain:
  nx: 4
  ny: 24
  nz: 12
  dx: 2.0
  dy: 2.0
  dz: 0.1
  dz_stretch: 1.1
  bottom_elevation:
    file: input/et9_dem.dat
  follow_terrain: true
  terrain_layers: uniform
  periodic:
    x: true
time:
  dt: 2.0
  t_end: 10800.0
  output_interval: 60.0
modules:
  surface_water: true
  groundwater: true
  transport: true
surface_water:
  friction:
    law: manning
    coefficient:
      constant: 0.03
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 0.001
groundwater:
  # S3-A18 pin: the noET 1271-dataset bitwise pin records the legacy
  # predictor-corrector trajectory (W11.8).
  predictor_corrector: legacy
  timestep:
    dt_init: 2.0
    dt_min: 1.0
    dt_max: 10.0
  specific_storage: 1.0e-05
  reallocation: disabled
soil:
  types:
  - name: sand
    ksx: 0.0001
    ksy: 0.0001
    ksz: 0.0001
    theta_s: 0.41
    theta_r: 0.05
    vg_alpha: 4.0
    vg_n: 2.5
  map:
    constant: sand
coupling:
  mode: subcycled
transport:
  scheme:
    advection: superbee
  # v2.0-equivalence pin (plan §2.6/§2.7-4, S3-A11): this lane is bitwise
  # against its T5-start hashes, so the flippable default is pinned
  # explicitly — the pin survives the T8 default flips.
  surface_dryout: discard
  dispersion:
    longitudinal: 0.0
    transverse: 0.0
    molecular: 1.0e-09
  surface_update: consistent
  subsurface_update: consistent
boundary_conditions:
- name: tide-north
  region:
    polygon:
    - - -1.0
      - 45.9
    - - 9.0
      - 45.9
    - - 9.0
      - 49.0
    - - -1.0
      - 49.0
  target: surface
  kind: eta
  value:
    series:
      file: input/et9_tide.dat
  inflow:
    closure: external
- name: inland-gw
  region:
    polygon:
    - - -1.0
      - -1.0
    - - 9.0
      - -1.0
    - - 9.0
      - 1.9
    - - -1.0
      - 1.9
  target: groundwater_side
  kind: head
  value:
    hydrostatic:
      eta: 0.2
- name: sea-gw
  region:
    polygon:
    - - -1.0
      - 46.1
    - - 9.0
      - 46.1
    - - 9.0
      - 49.0
    - - -1.0
      - 49.0
  target: groundwater_side
  kind: head
  value:
    hydrostatic:
      eta: 0.0
- name: sea-salt
  region:
    polygon:
    - - -1.0
      - 45.9
    - - 9.0
      - 45.9
    - - 9.0
      - 49.0
    - - -1.0
      - 49.0
  target: surface
  kind: scalar_value
  value:
    constant: 35.0
- name: inland-salt
  region:
    polygon:
    - - -1.0
      - -1.0
    - - 9.0
      - -1.0
    - - 9.0
      - 1.9
    - - -1.0
      - 1.9
  target: groundwater_side
  kind: scalar_value
  value:
    constant: 0.0
initial_conditions:
  surface:
    eta:
      constant: 0.0
  groundwater:
    water_table:
      constant: 0.0
  transport:
    surface:
      constant: 35.0
    groundwater:
      constant: 35.0
output:
  filename: out/output.h5
  variables:
    surface:
    - eta
    - depth
    - seepage_rate
    groundwater:
    - hydraulic_head
    - water_content
    transport:
    - concentration
    - concentration_surface
