# sx4 — a tracer step across a wetting/drying front (Stage-3 plan §12B):
# the ws4 10 % slope under a 2 mm draining film, closed walls, paired
# store, with the upper half at 35 psu and the lower at 5. Asserts: total
# tracer (surface + store) constant to rounding; wet-cell concentrations
# stay inside [5, 35] (no new extrema) through every limiter/parking
# event; J3 is trivial (closed domain, zero boundary salt).
simulation:
  id: sx4-front-slope
  title: Stage-3 sx4 tracer front across a wetting/drying slope (solve-consistent)
domain:
  nx: 1
  ny: 10
  nz: 1
  dx: 1.0
  dy: 1.0
  dz: 1.0
  bottom_elevation:
    file: input/ws4_slope.dat
time:
  dt: 1.0
  t_end: 1800.0
  output_interval: 60.0
modules:
  surface_water: true
  transport: true
surface_water:
  friction:
    law: manning
    coefficient:
      constant: 0.03
    thin_layer_depth: 0.1
  min_depth: 1.0e-05
  wetting_face_depth: 0.0001
transport:
  scheme:
    advection: upwind
  dispersion:
    longitudinal: 0.0
    transverse: 0.0
    molecular: 0.0
  surface_update: conservative
  surface_dryout: store
boundary_conditions:
- name: walls
  region:
    polygon:
    - - -1
      - -1
    - - 2
      - -1
    - - 2
      - 11
    - - -1
      - 11
  target: surface
  kind: velocity
  value:
    constant: 0.0
initial_conditions:
  surface:
    eta:
      file: input/ws4_slope_eta.dat
  transport:
    surface:
      file: input/sx4_tracer.dat
output:
  filename: out/output.h5
  monitor_interval: 0
  variables:
    surface:
    - eta
    - depth
    - water_store
    - film_removal_rate
    transport:
    - concentration_surface
    - salt_store
