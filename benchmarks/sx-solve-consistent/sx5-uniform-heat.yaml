# sx5 — sx1 with modules.temperature at a uniform 20 C (Stage-3 plan §12B,
# C6/R9): the temperature instance reads the same solve face volumes, so a
# uniform temperature stays uniform through wetting/drying and the heat
# ledger closes without an anchor-class correction.
