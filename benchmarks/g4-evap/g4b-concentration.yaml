# g4(b) — evaporative concentration (v2 plan §3.3, per-PR gate).
# The g4(a) basin with salinity: evaporation removes pure water, so
# s(t) = s0 * V0 / V(t) exactly, and global salt mass is constant.
# Gate: relative error <= 1e-4 on s(t); salt mass constant to 1e-10
# relative.
simulation:
  id: g4b-concentration
  title: g4(b) evaporative concentration (analytic)

domain:
  nx: 4
  ny: 3
  nz: 1
  dx: 1.0
  dy: 1.0
  dz: 0.5
  bottom_elevation: {constant: -0.1}

time:
  dt: 10.0
  t_end: 50000.0
  output_interval: 5000.0

modules:
  surface_water: true
  transport: true

surface_water:
  gravity: 9.81
  friction:
    coefficient: {constant: 0.0}
  min_depth: 1.0e-8
  wetting_face_depth: 1.0e-8
  evaporation: {constant: 1.0e-6}

transport:
  scheme: {advection: upwind}
  surface_diffusivity: {x: 0.0, y: 0.0}

initial_conditions:
  surface:
    eta: {constant: 0.0}
  transport:
    surface: {constant: 10.0}

boundary_conditions:
  - name: walls
    # An explicit closed basin: the default domain edge keeps the legacy
    # transmissive behavior (the b1 drain), which would flow water back IN
    # as evaporation draws the interior below the outside stage — measured
    # during gate bring-up as unbounded volume growth. Zero normal edge
    # velocity closes every edge face.
    region: {polygon: [[-1.0, -1.0], [5.0, -1.0], [5.0, 4.0], [-1.0, 4.0]]}
    target: surface
    kind: velocity
    value: {constant: 0.0}

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth]
    transport: [concentration_surface]
