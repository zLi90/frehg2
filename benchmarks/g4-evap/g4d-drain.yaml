# g4(d) — drain-to-dry (v2 plan §3.3, per-PR gate).
# The g4(a) basin with a shallower initial depth and a horizon that
# overshoots it: evaporation dries the basin mid-run. Gate: depth stays
# nonnegative at every output AND the mass audit closes — which requires
# the evaporation ledger to record the *actual* removed volume (the
# over-dry shortfall audited), not the potential E*A*t. Against pre-Q4
# code the closure fails by E*A*(t_end - t_dry): evaporation is
# subtracted unconditionally and the dry clamp re-creates the volume
# unaudited (v2 plan §3.1/§3.2 — the capability this sub-gate forces).
simulation:
  id: g4d-drain
  title: g4(d) evaporative drain-to-dry (positivity + audited shortfall)

domain:
  nx: 4
  ny: 3
  nz: 1
  dx: 1.0
  dy: 1.0
  dz: 0.5
  bottom_elevation: {constant: -0.02}

time:
  dt: 10.0
  t_end: 40000.0        # dries at t = 20000 s; half the horizon is dry
  output_interval: 5000.0

modules:
  surface_water: true

surface_water:
  gravity: 9.81
  friction:
    coefficient: {constant: 0.0}
  min_depth: 1.0e-8
  wetting_face_depth: 1.0e-8
  evaporation: {constant: 1.0e-6}

initial_conditions:
  surface:
    eta: {constant: 0.0}

boundary_conditions:
  - name: walls
    # An explicit closed basin: the default domain edge keeps the legacy
    # transmissive behavior (the b1 drain), which would flow water back IN
    # as evaporation draws the interior below the outside stage — measured
    # during gate bring-up as unbounded volume growth. Zero normal edge
    # velocity closes every edge face.
    region: {polygon: [[-1.0, -1.0], [5.0, -1.0], [5.0, 4.0], [-1.0, 4.0]]}
    target: surface
    kind: velocity
    value: {constant: 0.0}

output:
  filename: out/output.h5
  variables:
    surface: [eta, depth]
