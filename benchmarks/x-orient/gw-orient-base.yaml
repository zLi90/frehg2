# The v2 §8.1 groundwater dihedral battery base (Q7 x-gate backfill; the
# b3-derived case of the plan's designated set: like b3 it is
# variably-saturated Richards flow over a two-soil profile, made square and
# lateral so orientation content exists). A 6 x 6 x 2 m block, z-layered
# soils (input/gw_soil_id.dat — invariant under in-plane transforms),
# saturated to the surface, driven by a hydrostatic side head on the west
# edge, a constant-head side on the east edge, and a single-cell side flux
# on the south edge (off-centre at i = 3) — so the battery sweeps the
# groundwater_side kinds head(hydrostatic), head(constant) and flux over
# all four edges (plan §8.2 rows) while the off-centre flux keeps the head
# field injective. Density coupling stays OFF: with r = 1 the preserved
# legacy plus/minus ghost-head scaling split (Predictor.cpp ghostHead,
# legacy :777 vs :787) is dormant by construction — see
# docs/theory/symmetry-exemptions.md.
simulation:
  id: gw-orient
  title: Q7 8-orientation groundwater symmetry battery

domain:
  nx: 12
  ny: 12
  nz: 8
  dx: 0.5
  dy: 0.5
  dz: 0.25
  bottom_elevation: {constant: 2.0}
  follow_terrain: false

time:
  dt: 300.0
  t_end: 12000.0
  output_interval: 12000.0

modules:
  surface_water: false
  groundwater: true
  transport: false

groundwater:
  scheme: pca
  use_full3d: true
  specific_storage: 1.0e-5
  reallocation_surplus: redistribute
  timestep:
    dt_init: 300.0
    dt_min: 300.0
    dt_max: 300.0

soil:
  types:
    - name: upper
      ksx: 5.0e-4
      ksy: 5.0e-4
      ksz: 5.0e-4
      theta_s: 0.35
      theta_r: 0.02
      vg_alpha: 3.0
      vg_n: 2.0
    - name: lower
      ksx: 5.0e-5
      ksy: 5.0e-5
      ksz: 5.0e-5
      theta_s: 0.40
      theta_r: 0.05
      vg_alpha: 1.5
      vg_n: 1.8
  map: {file: input/gw_soil_id.dat}

initial_conditions:
  groundwater:
    water_table: {constant: 2.0}

boundary_conditions:
  # Side polygons select the member cells of one edge column/row by centre
  # (first column centres at 0.25), with the symmetric overhang convention.
  - name: head-in
    region: {polygon: [[-0.1, -0.1], [0.3, -0.1], [0.3, 6.1], [-0.1, 6.1]]}
    target: groundwater_side
    kind: head
    value: {hydrostatic: {eta: 2.06}}
  - name: head-out
    # side `head` with a constant is a uniform PRESSURE head ghost
    # (Predictor.cpp ghostHead): 0.0 puts the ghost total head at z, a
    # gently draining edge.
    region: {polygon: [[5.7, -0.1], [6.1, -0.1], [6.1, 6.1], [5.7, 6.1]]}
    target: groundwater_side
    kind: head
    value: {constant: 0.0}
  - name: side-flux
    # single south-edge cell i = 3 (centre (1.75, 0.25)) — also the §8.4
    # single-cell-wide side polygon instance for the gw module. The rate is
    # K-scale so the bump is a real feature of the head field (the y-axis
    # injectivity probe).
    region: {polygon: [[1.6, -0.1], [1.9, -0.1], [1.9, 0.3], [1.6, 0.3]]}
    target: groundwater_side
    kind: flux
    value: {constant: 2.0e-4}

output:
  filename: out/output.h5
  variables:
    groundwater: [hydraulic_head, water_content]
